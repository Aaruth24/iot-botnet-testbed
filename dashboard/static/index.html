<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IOT-TESTBED | BTNET-IDS</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script src="/socket.io/socket.io.js"></script><style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#0a0e13;--line:#30363d;--green:#00ff88;--red:#ff4444;--orange:#ff8c00;--blue:#58a6ff;--muted:#8b949e;--text:#e6edf3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:210px;background:#090c10;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column}.brand{color:var(--green);font:700 20px 'Courier New',monospace;letter-spacing:1px}.subtitle{font:11px 'Courier New',monospace;color:var(--muted);margin-top:4px}.nav{margin-top:34px;display:grid;gap:5px}.nav button{background:transparent;border:0;border-left:3px solid transparent;color:var(--muted);padding:12px 10px;text-align:left}.nav button:hover,.nav button.active{border-color:var(--green);background:#00ff8814;color:var(--green)}.badge{float:right;background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px}.system{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}.system p{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.dot.blue{background:var(--blue)}.dot.red{background:var(--red);animation:pulse 1s infinite}.main{flex:1;min-width:0;overflow:auto;padding:26px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{color:var(--green);font:12px 'Courier New',monospace;letter-spacing:2px}.topbar h1{margin:7px 0 0;font-size:28px}.clock{color:var(--muted);font-family:'Courier New',monospace}.statusbar,.card{background:var(--panel);border:1px solid var(--line);padding:18px}.statusbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.status-items{display:flex;gap:22px;flex-wrap:wrap}.status-items span{font-size:12px;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi .label,.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.value{font:700 28px 'Courier New',monospace;color:var(--green);margin-top:9px}.unit{font-size:12px;color:var(--muted)}.grid2,.two-col{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.card h2{font-size:15px;margin:0 0 15px}.topology-wrap{background:var(--panel2);border:1px solid #1d2733;min-height:440px}.topology{width:100%;height:440px}.gridlines{stroke:#0f1620;stroke-width:1}.link{stroke:var(--green);stroke-width:1.5;opacity:.7}.link.infected{stroke:var(--red);stroke-dasharray:5 4}.node{fill:#18212c;stroke:var(--green);stroke-width:1}.node.infected{stroke:var(--red);fill:#2a1719}.node-text{fill:var(--text);font:10px 'Courier New',monospace;text-anchor:middle}.switch,.gateway{fill:#11243a;stroke:var(--blue);stroke-width:2}.gateway{stroke-width:1}.alert-list,.log{display:grid;gap:9px;max-height:390px;overflow:auto}.alert{border-left:3px solid var(--orange);background:#ff8c0017;padding:10px}.alert.critical{border-color:var(--red);background:#ff444417}.alert.medium{border-color:var(--blue);background:#58a6ff17}.alert-head{display:flex;justify-content:space-between;gap:10px}.tag{font-size:10px;font-weight:700;padding:3px 6px;border-radius:3px;background:#ff8c0033;color:var(--orange)}.tag.red{background:#ff444433;color:var(--red)}.tag.blue{background:#58a6ff33;color:var(--blue)}.alert p{margin:7px 0 3px}.alert small,.muted{color:var(--muted)}.empty{padding:45px 12px;text-align:center;color:var(--muted)}.view-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.view-title h2{margin:0}.toggle-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}.toggle{border:1px solid var(--line);background:#0d1117;color:var(--muted);padding:9px 10px}.toggle.selected{border-color:var(--red);color:var(--red);background:#ff444414}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);padding:10px}.primary,.danger{width:100%;border:1px solid var(--green);background:#00ff8818;color:var(--green);padding:12px;margin-top:16px;font-weight:700}.danger{border-color:var(--red);background:#ff444418;color:var(--red);margin-top:0}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.progress{height:12px;background:#0d1117;border:1px solid var(--line);overflow:hidden}.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.statbox{border:1px solid var(--line);padding:12px}.statbox b{font:700 20px 'Courier New',monospace;color:var(--orange);display:block}.terminal{background:#090c10;color:var(--orange);font:12px 'Courier New',monospace;line-height:1.8;padding:12px;max-height:200px;overflow:auto}.terminal time{color:#59636e}.terminal strong{color:var(--red)}.summary{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.summary b{font:700 20px 'Courier New',monospace}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar-row{display:grid;grid-template-columns:100px 1fr 45px;align-items:center;gap:8px;margin:12px 0;font-size:12px}.bar{height:13px;background:#0d1117;border:1px solid var(--line)}.bar i{display:block;height:100%}.hardware{background:var(--red)}.vm{background:var(--orange)}.docker{background:var(--green)}table{width:100%;border-collapse:collapse;margin-top:18px;background:var(--panel)}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase}td:nth-child(2){color:var(--red)}td:nth-child(3){color:var(--orange)}td:nth-child(4){color:var(--green);font-weight:700}.devices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.device{border:1px solid var(--line);padding:8px;font:11px 'Courier New',monospace}.device.infected{border-color:var(--red);color:var(--red)}.linkbtn{border:0;background:0;color:var(--blue);float:right}@keyframes pulse{50%{opacity:.25}}@media(max-width:900px){.sidebar{width:170px}.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.two-col,.compare-grid{grid-template-columns:1fr}}@media(max-width:600px){.app{display:block}.sidebar{width:100%;height:auto}.nav{display:flex;overflow:auto;margin-top:20px}.nav button{white-space:nowrap}.system{display:none}.main{padding:15px}.value{font-size:20px}.devices{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">IOT-TESTBED</div><div class="subtitle">BTNET-IDS v1.0</div><nav class="nav"><button data-view="overview" class="active">Overview</button><button data-view="topology">Network Topology</button><button data-view="attack">Attack Simulation</button><button data-view="alerts">IDS Alerts <span id="alertBadge" class="badge">0</span></button><button data-view="comparison">Comparison</button></nav><div class="system"><div class="label">SYSTEM STATUS</div><p><span><i class="dot"></i>Docker</span>Running</p><p><span><i class="dot"></i>Mininet</span>Active</p><p><span><i class="dot blue"></i>IDS</span>Monitoring</p><p><span><i id="attackDot" class="dot"></i>Attack</span><span id="attackState">IDLE</span></p></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">LIVE SECURITY OPERATIONS</div><h1 id="pageTitle">Overview</h1></div><div class="clock" id="clock"></div></header><div id="view"></div></main></div><script>
const fallback={metrics:{accuracy:94.2,f1:.923,fpr:3.8,latency:12},alerts:[],log:[],stats:{packets_analyzed:0,anomalies_detected:0,devices_online:10,uptime_seconds:0},comparison:{hardware:{accuracy:78,f1:.74,fpr:12.1,setup_time:120,memory_gb:16,max_nodes:5,latency_ms:28,cost:'High',reproducibility:'Low'},vm:{accuracy:82,f1:.81,fpr:8.4,setup_time:45,memory_gb:8,max_nodes:20,latency_ms:19,cost:'Medium',reproducibility:'Medium'},docker:{accuracy:94.2,f1:.923,fpr:3.8,setup_time:8,memory_gb:2,max_nodes:100,latency_ms:12,cost:'Low',reproducibility:'High'}}};let currentView='overview',metrics=fallback.metrics,alerts=[],log=[],stats=fallback.stats,attack={running:false,started:0,duration:25,infected:0},timers=[];const devices=Array.from({length:10},(_,i)=>({name:'h'+(i+1),ip:'10.0.0.'+(i+1),status:'normal'}));window.attackType='syn_flood';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v,d=1){return Number(v||0).toLocaleString(undefined,{maximumFractionDigits:d})}function now(){return new Date().toISOString()}async function get(path,backup){try{const r=await fetch(path);if(!r.ok)throw Error(r.status);return await r.json()}catch(e){return backup}}async function refresh(){metrics=await get('/api/metrics',metrics);const a=await get('/api/alerts?limit=100',null);if(a)alerts=a.alerts||[];log=await get('/api/attack-log',log);stats=await get('/api/stats',stats);render()}
function topologySvg(){let lines='',nodes='';devices.forEach((d,i)=>{const a=-Math.PI/2+i*Math.PI*2/10,x=300+148*Math.cos(a),y=205+148*Math.sin(a),bad=d.status==='infected';lines+=`<line class="link ${bad?'infected':''}" x1="300" y1="205" x2="${x}" y2="${y}"/>`;nodes+=`<g><rect class="node ${bad?'infected':''}" x="${x-22}" y="${y-14}" width="44" height="28"/><text class="node-text" x="${x}" y="${y-2}">${d.name}</text><text class="node-text" x="${x}" y="${y+9}">${d.ip.split('.').pop()}</text></g>`});return`<svg class="topology" viewBox="0 0 620 440"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" class="gridlines"/></pattern></defs><rect width="620" height="440" fill="url(#grid)"/>${lines}<rect class="switch" x="266" y="187" width="68" height="36"/><text class="node-text" x="300" y="202">OF-S1</text><text class="node-text" x="300" y="214">SWITCH</text>${nodes}<ellipse class="gateway" cx="300" cy="388" rx="62" ry="23"/><text class="node-text" x="300" y="392">INTERNET</text>${attack.running?'<rect class="node infected" x="476" y="30" width="78" height="34"/><text class="node-text" x="515" y="50">C2 SERVER</text>':''}<text x="300" y="428" text-anchor="middle" fill="${attack.running?'#ff4444':'#00ff88'}" font-size="12">${attack.running?'Attack in progress':'All systems nominal'}</text></svg>`}
function alertsHtml(items=alerts.slice(0,5)){if(!items.length)return'<div class="empty">No anomalies detected. Launch a simulation to test the IDS.</div>';return items.map(a=>{const s=String(a.severity||'HIGH').toUpperCase(),cl=s==='CRITICAL'?'critical':s==='MEDIUM'?'medium':'';return`<div class="alert ${cl}"><div class="alert-head"><span><b class="tag ${cl==='critical'?'red':cl==='medium'?'blue':''}">${esc(s)}</b> <b class="tag">${esc(a.attack_type||'ANOMALY')}</b></span><small>${esc(a.timestamp||now())}</small></div><p>${esc(a.message||'Anomalous traffic pattern detected')}</p><small>Device: ${esc(a.device||a.src_ip||'unknown')} · ${esc(a.dst_ip||'10.0.0.100')}</small></div>`}).join('')}
function kpis(){return`<div class="kpis"><div class="card kpi"><div class="label">IDS Accuracy</div><div class="value">${fmt(metrics.accuracy>1?metrics.accuracy:metrics.accuracy*100)}<span class="unit">%</span></div></div><div class="card kpi"><div class="label">F1 Score</div><div class="value">${fmt(metrics.f1>1?metrics.f1:metrics.f1*100)}<span class="unit">%</span></div></div><div class="card kpi"><div class="label">False Positive Rate</div><div class="value">${fmt(metrics.fpr)}<span class="unit">%</span></div></div><div class="card kpi"><div class="label">Detection Latency</div><div class="value">${fmt(metrics.latency)}<span class="unit">ms</span></div></div></div>`}function overview(){return`<div class="statusbar"><div class="status-items"><span><i class="dot"></i>NETWORK NOMINAL</span><span><i class="dot blue"></i>IDS MONITORING</span><span><i class="dot"></i>CAPTURE ACTIVE</span></div><span class="muted">Docker / Linux runtime</span></div>${kpis()}<div class="grid2"><section class="card"><h2>Network Topology</h2><div class="topology-wrap">${topologySvg()}</div></section><section class="card"><h2>Recent IDS Alerts <button class="linkbtn" onclick="show('alerts')">view all →</button></h2><div class="alert-list">${alertsHtml()}</div></section></div>`}function topologyView(){return`<div class="card"><div class="view-title"><h2>OpenFlow Network Topology</h2><span class="muted">${devices.filter(d=>d.status==='normal').length} normal · ${devices.filter(d=>d.status==='infected').length} infected</span></div><div class="topology-wrap">${topologySvg()}</div><div class="devices">${devices.map(d=>`<div class="device ${d.status==='infected'?'infected':''}"><b>${d.name}</b><br>${d.ip}<br>${d.status.toUpperCase()}</div>`).join('')}</div></div>`}
function attackView(){const elapsed=attack.running?Math.min(100,(Date.now()-attack.started)/(attack.duration*1000)*100):0;return`<div class="two-col"><section class="card"><h2>Attack Configuration</h2><div class="toggle-row">${[['syn_flood','SYN Flood'],['udp_flood','UDP Flood'],['http_flood','HTTP Flood'],['port_scan','Port Scan']].map(([v,l])=>`<button class="toggle ${window.attackType===v?'selected':''}" onclick="window.attackType='${v}';render()" ${attack.running?'disabled':''}>${l}</button>`).join('')}</div><div class="form-grid"><div class="field"><label>TARGET IP</label><input id="target" value="10.0.0.100"></div><div class="field"><label>PACKET RATE</label><input id="rate" type="number" value="1000"></div><div class="field"><label>DURATION (SEC)</label><input id="duration" type="number" value="25"></div><div class="field"><label>PROTOCOL</label><input disabled value="${window.attackType==='udp_flood'?'UDP / rand':window.attackType==='http_flood'?'TCP / 80':window.attackType==='port_scan'?'TCP / scan':'TCP / SYN'}"></div></div><div class="button-row">${attack.running?'<button class="danger" onclick="stopAttack()">STOP ATTACK</button>':''}<button class="primary" onclick="startAttack()" ${attack.running?'disabled':''}>${attack.running?'ATTACK RUNNING':'LAUNCH ATTACK'}</button></div></section><section class="card"><h2>Attack Progress</h2>${attack.running?`<div class="progress"><i style="width:${elapsed}%"></i></div><p class="muted">${Math.round(elapsed)}% complete · ${attack.infected} devices compromised</p><div class="statgrid"><div class="statbox"><b>${attack.infected}</b>Devices Infected</div><div class="statbox"><b>${stats.anomalies_detected}</b>IDS Detections</div><div class="statbox"><b>${fmt(stats.packets_analyzed)}</b>Packets Analyzed</div><div class="statbox"><b>${stats.anomalies_detected}</b>Anomalies Found</div></div>`:'<div class="empty">Simulation idle<br><span class="muted">Configure an attack to begin the live demo.</span></div>'}</section></div><section class="card" style="margin-top:16px"><h2>Botnet Activity Log</h2><div class="terminal">${log.length?log.map(l=>`<div><time>[${esc(String(l.timestamp||'').slice(11,19)||'--:--:--')}]</time> <strong>[BOTNET]</strong> ${esc(l.src_ip||'device')} (${esc(l.dst_ip||'')}) — ${esc(l.attack_type||'activity')}</div>`).join(''):'<div class="muted">Waiting for attack activity...</div>'}</div></section>`}
function comparisonView(){const labels={accuracy:'IDS Accuracy (%)',setup_time:'Setup Time (min)',memory_gb:'Memory Usage (GB)',max_nodes:'Max Scalable Nodes'},keys=['accuracy','setup_time','memory_gb','max_nodes'];return`<div class="compare-grid">${keys.map(key=>{const max=Math.max(...Object.values(fallback.comparison).map(x=>Number(x[key])));return`<section class="card"><h2>${labels[key]}</h2><small class="muted">${key==='setup_time'||key==='memory_gb'?'↓ lower is better':'↑ higher is better'}</small>${[['hardware','Hardware'],['vm','VM-based'],['docker','Docker']].map(([k,l])=>`<div class="bar-row"><span>${l}</span><div class="bar"><i class="${k}" style="width:${Number(fallback.comparison[k][key])/max*100}%"></i></div><b>${fmt(fallback.comparison[k][key],2)}</b></div>`).join('')}</section>`}).join('')}</div><section class="card"><h2>Full Comparison</h2><table><thead><tr><th>Metric</th><th>Hardware</th><th>VM-Based</th><th>Docker ✓</th></tr></thead><tbody>${[['IDS Accuracy','accuracy','%'],['F1 Score','f1',''],['False Positive Rate','fpr','%'],['Setup Time','setup_time','min'],['Memory RAM','memory_gb','GB'],['Max Scalable Nodes','max_nodes',''],['Detection Latency','latency_ms','ms'],['Cost','cost',''],['Reproducibility','reproducibility','']].map(([l,k,u])=>`<tr><td>${l}</td><td>${fallback.comparison.hardware[k]}${u}</td><td>${fallback.comparison.vm[k]}${u}</td><td>${fallback.comparison.docker[k]}${u}</td></tr>`).join('')}</tbody></table></section>`}function alertsView(){return`<div class="card"><div class="summary"><span>Total <b>${alerts.length}</b></span><span style="color:var(--red)">Critical <b>${alerts.filter(a=>a.severity==='CRITICAL').length}</b></span><span style="color:var(--orange)">High <b>${alerts.filter(a=>a.severity==='HIGH').length}</b></span><span style="color:var(--blue)">Medium <b>${alerts.filter(a=>a.severity==='MEDIUM').length}</b></span><span style="color:var(--green)">● IDS detecting</span></div><div class="alert-list">${alertsHtml(alerts)}</div></div>`}function render(){const titles={overview:'Overview',topology:'Network Topology',attack:'Attack Simulation',alerts:'IDS Alerts',comparison:'Testbed Comparison'};document.getElementById('pageTitle').textContent=titles[currentView];document.getElementById('view').innerHTML=currentView==='overview'?overview():currentView==='topology'?topologyView():currentView==='attack'?attackView():currentView==='alerts'?alertsView():comparisonView();document.getElementById('alertBadge').textContent=alerts.length;document.getElementById('attackState').textContent=attack.running?'ACTIVE':'IDLE';document.getElementById('attackDot').className='dot '+(attack.running?'red':'')}
function show(v){currentView=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}function addDemoAlert(){const sev=['CRITICAL','HIGH','MEDIUM'][Math.floor(Math.random()*3)];alerts.unshift({severity:sev,attack_type:window.attackType,timestamp:now(),message:'Anomalous traffic detected by Isolation Forest',device:'h'+Math.max(1,attack.infected),src_ip:'10.0.0.'+Math.max(1,attack.infected)});stats.anomalies_detected++}async function startAttack(){const duration=Number(document.getElementById('duration')?.value||25);attack={running:true,started:Date.now(),duration,infected:0};try{const r=await fetch('/api/start-attack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attack_type:window.attackType,target_ip:document.getElementById('target').value,duration,packet_rate:Number(document.getElementById('rate').value||1000)})});if(!r.ok)throw Error('offline')}catch(e){}timers.push(setInterval(()=>{const elapsed=(Date.now()-attack.started)/1000;attack.infected=Math.min(8,Math.floor(elapsed/1.5)+1);devices.forEach((d,i)=>d.status=i<attack.infected?'infected':'normal');stats.packets_analyzed+=Math.floor(Math.random()*5000);if(Math.floor(elapsed)%2===0)addDemoAlert();if(elapsed>=duration)stopAttack(false);render()},1000));show('attack')}async function stopAttack(remote=true){if(remote)try{await fetch('/api/stop-attack',{method:'POST'})}catch(e){}timers.forEach(clearInterval);timers=[];attack.running=false;render()}function connectSocket(){if(!window.io)return;const socket=window.io(window.location.origin);socket.on('connect',()=>console.log('Connected to BTNET-IDS'));socket.on('metrics_update',m=>{metrics=m;render()});socket.on('alert_new',a=>{alerts.unshift(a);render()});socket.on('stats_update',s=>{stats=s;render()})}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString(),1000);refresh();connectSocket();setInterval(refresh,3000);render();
</script></body></html>
